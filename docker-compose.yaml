# Общая часть всех станций Liquidsoap. Сами сервисы генерируются
# из stations.toml — см. блок GENERATED ниже.
x-liquidsoap: &liquidsoap
  build:
    context: ./
    dockerfile: ./docker/liquidsoap/Dockerfile
    args:
      - "USER_UID=${USER_UID:-1000}"
      - "USER_GID=${USER_GID:-1000}"
  environment:
    - "TZ=Europe/Moscow"
    - ICECAST_SOURCE_PASSWORD
    - OMFMAPI_USER
    - OMFMAPI_PASSWORD
    - LASTFM_OMFM_API_KEY
    - LASTFM_OMFM_API_SECRET
    - LASTFM_CDP_API_KEY
    - LASTFM_CDP_API_SECRET
  networks:
    - omfm-network
  depends_on:
    - omfmapi
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

services:
  omfmapi:
    container_name: omfmAPI
    build:
      context: ./
      dockerfile: ./docker/omfmapi/Dockerfile
    depends_on:
      - centrifugo
    environment:
      - "TZ=Europe/Moscow"
      - CENTRIFUGO_API_KEY
      - AZURACAST_API_KEY
      - OMFMAPI_USER
      - OMFMAPI_PASSWORD
      - SPOTIFY_CLIENT_ID
      - SPOTIFY_CLIENT_SECRET
    user: node:node
    restart: always
    ports:
       - 127.0.0.1:9999:9999
    networks:
       - omfm-network
    logging:
      driver: "json-file"
      options:
        max-size: "1m"  
        max-file: "3"

  listeners_monitor:
    build:
      context: ./
      dockerfile: ./docker/listeners_monitor/Dockerfile
    container_name: listeners_monitor
    networks:
      - omfm-network
    environment:
      TZ: "Europe/Moscow"
      STREAM_NAMES: "omfm,cdp"
      FINDIP_TOKEN: "${FINDIP_TOKEN:?FINDIP_TOKEN не задан в .env}"
    volumes:
      - /var/log/nginx:/var/log/nginx:ro
    restart: always
    secrets:
      - source: api_username
      - source: api_password
      - source: icecast_username
      - source: icecast_password
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

  centrifugo:
    container_name: centrifugo
    restart: always
    image: centrifugo/centrifugo:latest
    volumes:
      - ./docker/centrifugo/config.toml:/centrifugo/config.toml
    command: centrifugo -c config.toml
    ports:
       - 127.0.0.1:9998:9998
    # network_mode: "host"
    networks:
       - omfm-network
    depends_on:
      - icecast
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"


  # GENERATED from stations.toml — не править вручную, см. make apply
  liquidsoap-omfm:
    <<: *liquidsoap
    container_name: liquidsoap-omfm
    command: /home/radio/liquidsoap/omfm/index.liq
    ports:
      - 127.0.0.1:8007:8007
      - 127.0.0.1:1234:1234
    volumes:
      - /var/www/html/omfm/hls/omfm:/home/radio/liquidsoap/omfm/hls
      - /mnt/GoogleDrive:/mnt/GoogleDrive:ro
      - /home/radio/music:/home/radio/music
      - ./docker/liquidsoap/rootfs/home/radio/playlist:/home/radio/playlist
    healthcheck:
      # Ловит не только падение, но и зависание: если harbor перестал
      # отвечать, контейнер перезапустится сам. Supervisord так не умел.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8007/nowplaying"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  liquidsoap-cdp:
    <<: *liquidsoap
    container_name: liquidsoap-cdp
    command: /home/radio/liquidsoap/cdp/index.liq
    ports:
      - 127.0.0.1:8008:8008
      - 127.0.0.1:1235:1235
    volumes:
      - /var/www/html/omfm/hls/cdp:/home/radio/liquidsoap/cdp/hls
      - /mnt/GoogleDrive:/mnt/GoogleDrive:ro
      - /home/radio/music:/home/radio/music
      - ./docker/liquidsoap/rootfs/home/radio/playlist:/home/radio/playlist
    healthcheck:
      # Ловит не только падение, но и зависание: если harbor перестал
      # отвечать, контейнер перезапустится сам. Supervisord так не умел.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8008/nowplaying"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
# GENERATED end

  icecast:
    #image: libretime/icecast:2.5-beta3-alpine
    build:
      context: ./
      dockerfile: ./docker/icecast/Dockerfile
      args:
        - VERSION=
    container_name: icecast
    restart: always
    volumes:
      - ./docker/icecast/config/concat-om.pem:/usr/share/icecast/concat-om.pem
    networks:
      - omfm-network
    ports:
      - 8000:8000
      - 8443:8443
    environment:
      - "TZ=Europe/Moscow"
      - ICECAST_SOURCE_PASSWORD
      - ICECAST_ADMIN_PASSWORD
      - ICECAST_RELAY_PASSWORD
      - ICECAST_HOSTNAME
      - ICECAST_ADMIN_USERNAME
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"


networks:
  omfm-network:
    enable_ipv6: true # This is the standard modern toggle
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

secrets:
  api_username:
    file: ./docker/listeners_monitor/api_username.txt
  api_password:
    file: ./docker/listeners_monitor/api_password.txt
  icecast_username:
    file: ./docker/listeners_monitor/icecast_username.txt
  icecast_password:
    file: ./docker/listeners_monitor/icecast_password.txt


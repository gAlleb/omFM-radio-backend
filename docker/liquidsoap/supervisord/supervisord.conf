[supervisord]
user=root
nodaemon=false
logfile=/var/log/supervisor/supervisord.log ; (main log file;default $CWD/supervisord.log)
logfile_maxbytes=10MB        ; (max main logfile bytes b4 rotation;default 50MB)
logfile_backups=5           ; (num of main logfile rotation backups;default 10)
loglevel=info                ; (log level;default info; others: debug,warn,trace)
pidfile=/var/run/supervisord.pid ; (supervisord pidfile;default supervisord.pid)
minfds=1024                  ; (min. avail startup file descriptors;default 1024)
minprocs=200                 ; (min. avail process descriptors;default 200)

# GENERATED from stations.toml — не править вручную, см. make apply
[program:liquidsoap-omfm]
command=/usr/bin/liquidsoap /home/radio/liquidsoap/omfm/index.liq
user=radio
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/liquidsoap-omfm.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stdout_capture_maxbytes=1MB

[program:liquidsoap-cdp]
command=/usr/bin/liquidsoap /home/radio/liquidsoap/cdp/index.liq
user=radio
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/liquidsoap-cdp.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stdout_capture_maxbytes=1MB
# GENERATED end
